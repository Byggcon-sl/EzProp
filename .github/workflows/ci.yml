name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgres://ezprop:ezprop@localhost:5432/ezprop
  TEST_DATABASE_URL: postgres://ezprop:ezprop@localhost:5432/ezprop_test
  BETTER_AUTH_SECRET: ci-hemmelighet-som-bare-brukes-i-tester-0123456789
  BETTER_AUTH_URL: http://localhost:3000
  SEED_ADMIN_EMAIL: admin@byggcon.no
  DEV_MAILBOX: "1"
  # Prøve uten nett (fase 1). Ingen synktjeneste kjører i CI; verdiene trengs for token-ruten.
  POWERSYNC_URL: http://localhost:8080
  POWERSYNC_JWT_SECRET: ci-synknokkel-bare-for-automatiske-tester-0123456789
  TRIAL_UPLOAD_DIR: var/uploads/trial
  NEXT_PUBLIC_OFFLINE_TRIAL_TEST_HOOKS: "1"

jobs:
  check:
    name: Lint, typesjekk, test og bygg
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ezprop
          POSTGRES_PASSWORD: ezprop
          POSTGRES_DB: ezprop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ezprop" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Lag testdatabase
        run: PGPASSWORD=ezprop psql -h localhost -U ezprop -c "create database ezprop_test"
      - name: Migreringer
        run: pnpm db:migrate
      - name: Sjekk at migreringer er i takt med skjemaet
        run: pnpm db:generate && test -z "$(git status --porcelain src/db/migrations)"
      - run: pnpm test
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

  e2e:
    name: Ende-til-ende (Playwright, PC og iPad)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ezprop
          POSTGRES_PASSWORD: ezprop
          POSTGRES_DB: ezprop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ezprop" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Hent Playwright-versjon
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
