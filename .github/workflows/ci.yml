name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Startes av «Oppdater åpne PR-er» etter at den har oppdatert en PR-branch
  workflow_dispatch:

env:
  DATABASE_URL: postgres://ezprop:ezprop@localhost:5432/ezprop
  TEST_DATABASE_URL: postgres://ezprop:ezprop@localhost:5432/ezprop_test
  BETTER_AUTH_SECRET: ci-hemmelighet-som-bare-brukes-i-tester-0123456789
  BETTER_AUTH_URL: http://localhost:3000
  SEED_ADMIN_EMAIL: admin@byggcon.no
  # Produksjonsvakten for testdata og testoppdrag (A302) godtar bare development og test
  APP_ENVIRONMENT: test
  DEV_MAILBOX: "1"
  TRIAL_UPLOAD_DIR: var/uploads/trial
  NEXT_PUBLIC_OFFLINE_TRIAL_TEST_HOOKS: "1"

jobs:
  # Endrer PR-en bare dokumenter (docs/ og .md-filer som ingen test leser) og versjonsnummeret,
  # hoppes de tunge jobbene over. På main kjøres alltid alt.
  endringer:
    name: Hva er endret
    runs-on: ubuntu-latest
    outputs:
      kun_dokumenter: ${{ steps.sjekk.outputs.kun_dokumenter }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: sjekk
        run: bash scripts/ci/kun-dokumenter.sh "${{ github.ref }}" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, typesjekk, test og bygg
    needs: endringer
    if: needs.endringer.outputs.kun_dokumenter != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ezprop
          POSTGRES_PASSWORD: ezprop
          POSTGRES_DB: ezprop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ezprop" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Lag testdatabase
        run: PGPASSWORD=ezprop psql -h localhost -U ezprop -c "create database ezprop_test"
      - name: Migreringer
        run: pnpm db:migrate && pnpm db:migrate
      - name: Sjekk at migreringer er i takt med skjemaet
        run: pnpm db:generate && test -z "$(git status --porcelain src/db/migrations)"
      - run: pnpm test
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

  bicep:
    name: Bicep for testmiljøet (uten innlogging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bygg og lint main.bicep
        run: |
          az bicep install
          az bicep build --file infra/azure/main.bicep --outfile "$RUNNER_TEMP/main.json"
          az bicep lint --file infra/azure/main.bicep
      # Nøkkelboksen (ADR 0005) skal være av som standard: alle Microsoft.KeyVault-ressurser må ha
      # betingelsen enableKeyVault, ellers lager en merge til main en nøkkelboks.
      - name: Sjekk at nøkkelboksen har betingelsen enableKeyVault
        run: |
          missing=$(jq -r '
            (.resources | if type == "object" then [.[]] else . end)[]
            | select(.type | startswith("Microsoft.KeyVault/"))
            | select(((.condition // "") | contains("parameters('"'"'enableKeyVault'"'"')")) | not)
            | "\(.type) \(.name)"
          ' "$RUNNER_TEMP/main.json")
          count=$(jq '[(.resources | if type == "object" then [.[]] else . end)[] | select(.type | startswith("Microsoft.KeyVault/"))] | length' "$RUNNER_TEMP/main.json")
          if [ -n "$missing" ]; then
            echo "Disse ressursene mangler betingelsen enableKeyVault:"
            echo "$missing"
            exit 1
          fi
          if [ "$count" -lt 5 ]; then
            echo "Fant $count Microsoft.KeyVault-ressurser, ventet minst 5 (boksen, policyen og tre hemmeligheter)."
            exit 1
          fi
          echo "Alle $count Microsoft.KeyVault-ressurser har betingelsen enableKeyVault."

  e2e:
    name: Ende-til-ende (Playwright, PC og iPad)
    needs: endringer
    if: needs.endringer.outputs.kun_dokumenter != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ezprop
          POSTGRES_PASSWORD: ezprop
          POSTGRES_DB: ezprop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ezprop" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Hent Playwright-versjon
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed:testoppdrag
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
