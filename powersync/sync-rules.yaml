# Prøve fase 1, kastes eller gjøres om etter ADR.
#
# Synkregler: hver iPad får bare radene til organisasjonen i JWT-en (`organization_id` er alltid
# `grant.organizationId` fra tilgangssjekken). Myk slettede rader forlater bøtta og fjernes på
# enheten; serveren beholder dem. `storage_path` synkes aldri til enheten. Alle tre tabellene
# sender bare kolonnene i `localColumnsOf` (sync/local-columns.ts), som de andre
# kandidatene; aldri `created_by`, `updated_by` eller `deleted_by`.

bucket_definitions:
  by_organization:
    parameters: SELECT request.jwt() ->> 'organization_id' AS organization_id
    data:
      - SELECT id, name, created_at, updated_at, deleted_at FROM trial_forms WHERE organization_id = bucket.organization_id AND deleted_at IS NULL
      - SELECT id, trial_form_id, field_key, value, text_state, device_id, created_at, updated_at, deleted_at FROM trial_answers WHERE organization_id = bucket.organization_id AND deleted_at IS NULL
      - SELECT id, trial_form_id, field_key, name, size_bytes, sha256, uploaded_at, device_id, created_at, updated_at, deleted_at FROM trial_photos WHERE organization_id = bucket.organization_id AND deleted_at IS NULL
