# PostgreSQL for lokal utvikling på Mac (Docker Desktop).
# Start med ./start.sh. Verdiene her er bare for utvikling på egen maskin.
services:
  db:
    image: postgres:16
    # Logisk replikering trengs ikke lenger (PowerSync og ElectricSQL er fjernet,
    # ADR 0004). Linjen står til replikeringsplassene fra prøven er ryddet bort av migrering 0026
    # på alle Macer: PostgreSQL starter ikke med en logisk plass og lavere wal_level.
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: ezprop
      POSTGRES_PASSWORD: ezprop
      POSTGRES_DB: ezprop
    ports:
      # På Macen bruker start.sh port 5433, så EzProp kan kjøre side om side med Optiplan (5432).
      - "${EZPROP_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezprop"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
