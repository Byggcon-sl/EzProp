# PostgreSQL for lokal utvikling på Mac (Docker Desktop): `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ezprop
      POSTGRES_PASSWORD: ezprop
      POSTGRES_DB: ezprop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezprop"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
